<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGPM - Task Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <!-- Rendered by app.js -->
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Header -->
        <header class="header">
            <h3 style="flex: 1; font-weight: 500;">
                <a href="index.html" style="text-decoration: none; color: var(--primary-color); margin-right: 10px;">←
                    Back</a>
                Project: <span id="headerProjectName" style="font-weight: 600;">Đang tải...</span>
            </h3>
            <div id="user-info" style="display: flex; gap: 10px; align-items: center;">
                <button id="btnLogin"
                    style="padding: 6px 12px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Login
                </button>
            </div>
        </header>

        <!-- Content Area -->
        <div class="content-area">

            <!-- Project Details Section -->
            <div class="list-container" style="margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h2>Thông tin Dự án</h2>
                    <button id="btnSaveProjectDetails"
                        style="padding: 6px 12px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; display: none;">Lưu
                        Thông Tin</button>
                </div>

                <div
                    style="display: flex; flex-direction: column; gap: 15px; background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px;">
                    <div class="project-links-grid">
                        <!-- Các link sẽ được JS điền href vào thẻ a, mặc định là href="#" -->
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <a href="#" id="linkGit" target="_blank"
                                style="font-size: 0.9em; font-weight: 600; color: var(--primary-color); text-decoration: none;">Git
                                Repository</a>
                            <button id="btnEditGit" class="icon-btn btn-edit-link" title="Chỉnh sửa link"
                                style="display: none; padding: 2px;">✏️</button>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <a href="#" id="linkUseCase" target="_blank"
                                style="font-size: 0.9em; font-weight: 600; color: var(--primary-color); text-decoration: none;">Use
                                Case (Google Drive)</a>
                            <button id="btnEditUseCase" class="icon-btn btn-edit-link" title="Chỉnh sửa link"
                                style="display: none; padding: 2px;">✏️</button>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <a href="#" id="linkGdd" target="_blank"
                                style="font-size: 0.9em; font-weight: 600; color: var(--primary-color); text-decoration: none;">Game
                                Design Document (GDD)</a>
                            <button id="btnEditGdd" class="icon-btn btn-edit-link" title="Chỉnh sửa link"
                                style="display: none; padding: 2px;">✏️</button>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <a href="#" id="linkWireframe" target="_blank"
                                style="font-size: 0.9em; font-weight: 600; color: var(--primary-color); text-decoration: none;">Wireframe
                                / Design</a>
                            <button id="btnEditWireframe" class="icon-btn btn-edit-link" title="Chỉnh sửa link"
                                style="display: none; padding: 2px;">✏️</button>
                        </div>
                    </div>
                    <div>
                        <label
                            style="font-size: 0.85em; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 5px;">Mô
                            tả dự án</label>
                        <textarea id="projectDescInput" class="grid-input"
                            style="width: 100%; min-height: 60px; resize: vertical;"
                            placeholder="Nhập mô tả dự án..."></textarea>
                    </div>
                </div>
            </div>

            <div class="list-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h2>Task Board</h2>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button id="btnSaveAll"
                            style="padding: 8px 16px; background: #673AB7; color: white; border: none; border-radius: var(--border-radius-sm); cursor: pointer; font-weight: 500; display: none;">
                            Lưu Tất Cả Các Dòng Bị Đổi
                        </button>
                    </div>
                </div>

                <!-- Filters Bar -->
                <div class="task-filters-bar task-filters-grid"
                    style="margin-bottom: 15px; padding: 10px; background: white; border: 1px solid var(--border-color); border-radius: 8px;">
                    <input type="text" id="searchTaskInput" placeholder="🔍 Tìm kiếm task..." class="grid-input"
                        style="padding: 8px 12px; border-radius: 20px;">
                    <select id="filterStatus" class="grid-select"
                        style="padding: 6px 10px; border-radius: 20px; font-size: 0.9em;">
                        <option value="all">Tất cả Trạng thái</option>
                        <option value="todo">To Do</option>
                        <option value="inprogress">In Progress</option>
                        <option value="done">Done</option>
                    </select>
                    <select id="filterAssignee" class="grid-select"
                        style="padding: 6px 10px; border-radius: 20px; font-size: 0.9em;">
                        <option value="all">Tất cả Assignees</option>
                    </select>
                    <select id="filterSprint" class="grid-select"
                        style="padding: 6px 10px; border-radius: 20px; font-size: 0.9em;">
                        <option value="all">Tất cả Sprint</option>
                    </select>
                    <select id="filterCategory" class="grid-select"
                        style="padding: 6px 10px; border-radius: 20px; font-size: 0.9em;">
                        <option value="all">Tất cả Category</option>
                    </select>
                    <select id="filterTag" class="grid-select"
                        style="padding: 6px 10px; border-radius: 20px; font-size: 0.9em;">
                        <option value="all">Tất cả Tag</option>
                    </select>
                </div>

                <!-- Data Grid Table -->
                <div class="table-container">
                    <table class="data-grid" id="tasksTable">
                        <thead>
                            <tr>
                                <th style="width: 35%;">USE CASE (TÊN TASK)</th>
                                <th style="width: 15%;">TRẠNG THÁI</th>
                                <th style="width: 25%;">ASSIGNEES</th>
                                <th style="width: 15%;">BRANCH</th>
                                <th style="width: 10%; text-align: center;">THAO TÁC</th>
                            </tr>
                        </thead>
                        <tbody id="taskListBody">
                            <!-- Inline Add Row (Always First) -->
                            <tr class="add-row">
                                <td>
                                    <input type="text" id="newTaskName" placeholder="Nhập tên Use Case mới..."
                                        class="grid-input" style="font-weight: 600;">
                                </td>
                                <td>
                                    <select id="newTaskStatus" class="grid-select">
                                        <option value="todo">To Do</option>
                                        <option value="inprogress">In Progress</option>
                                        <option value="done">Done</option>
                                    </select>
                                </td>
                                <td>
                                    <div class="assignee-chips-container" id="newTaskAssigneeContainer"
                                        style="display: flex; flex-wrap: wrap; gap: 5px; cursor: pointer; min-height: 32px; align-items: center; padding: 4px; border: 1px dashed var(--border-color); border-radius: 4px;"
                                        title="Click để gán người">
                                        <span
                                            style="color: var(--text-secondary); font-size: 0.9em; padding-left: 5px;">+
                                            Thêm người</span>
                                    </div>
                                    <!-- Hidden input to store ids -->
                                    <input type="hidden" id="newTaskAssigneeIds" value="">
                                </td>
                                <td>
                                    <input type="text" id="newTaskBranch" placeholder="VD: feature/auth"
                                        class="grid-input" style="font-family: monospace; font-size: 0.9em;">
                                </td>
                                <td style="text-align: center;">
                                    <button id="btnInlineAdd" class="icon-btn" title="Thêm Task mới"
                                        style="color: var(--primary-color);">➕</button>
                                </td>
                            </tr>

                            <!-- Dynamic rows will go here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Project Links Edit Modal -->
    <div id="projectLinksModal" class="modal-overlay"
        style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div class="modal-content"
            style="background: white; padding: 20px; border-radius: var(--border-radius-md); width: 500px; max-width: 90vw;">
            <h3 style="margin-top: 0; margin-bottom: 15px;">Chỉnh sửa Links Dự Án</h3>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label
                        style="font-size: 0.85em; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 5px;">Git
                        Repository</label>
                    <input type="url" id="modalGitInput" class="grid-input" style="width: 100%;"
                        placeholder="https://github.com/...">
                </div>
                <div>
                    <label
                        style="font-size: 0.85em; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 5px;">Use
                        Case (Google Drive)</label>
                    <input type="url" id="modalUseCaseInput" class="grid-input" style="width: 100%;"
                        placeholder="https://docs.google.com/...">
                </div>
                <div>
                    <label
                        style="font-size: 0.85em; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 5px;">Game
                        Design Document (GDD)</label>
                    <input type="url" id="modalGddInput" class="grid-input" style="width: 100%;"
                        placeholder="https://docs.google.com/...">
                </div>
                <div>
                    <label
                        style="font-size: 0.85em; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 5px;">Wireframe
                        / Design</label>
                    <input type="url" id="modalWireframeInput" class="grid-input" style="width: 100%;"
                        placeholder="https://figma.com/...">
                </div>
            </div>
            <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button id="btnCancelLinks" class="btn-cancel"
                    style="padding: 8px 16px; border: 1px solid #ccc; background: transparent; cursor: pointer; border-radius: 4px;">Hủy</button>
                <button id="btnSaveLinks" class="btn-save"
                    style="padding: 8px 16px; background: var(--primary-color); color: white; border: none; cursor: pointer; border-radius: 4px;">Lưu
                    Links</button>
            </div>
        </div>
    </div>

    <!-- Assignee Picker Modal -->
    <div id="assigneeModal" class="modal-overlay"
        style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div class="modal-content"
            style="background: white; padding: 20px; border-radius: var(--border-radius-md); width: 400px; max-height: 80vh; display: flex; flex-direction: column;">
            <h3 style="margin-top: 0; margin-bottom: 15px;">Chọn Assignees</h3>
            <div style="margin-bottom: 15px;">
                <input type="text" id="searchAssigneeInput" placeholder="Tìm tên sinh viên..." class="grid-input"
                    style="width: 100%; border-radius: 4px; padding: 8px;">
            </div>
            <div id="assigneeListContainer"
                style="flex: 1; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 4px; padding: 10px;">
                <!-- Render list of checkboxes -->
            </div>
            <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button id="btnCancelAssignee" class="btn-cancel"
                    style="padding: 8px 16px; border: 1px solid #ccc; background: transparent; cursor: pointer; border-radius: 4px;">Hủy</button>
                <button id="btnConfirmAssignee" class="btn-save"
                    style="padding: 8px 16px; background: var(--primary-color); color: white; border: none; cursor: pointer; border-radius: 4px;">Xác
                    nhận</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/tasks.js"></script>
</body>

</html>
