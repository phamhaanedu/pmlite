<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Templates - PM Lite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <!-- Rendered by app.js -->
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Header -->
        <header class="header">
            <h3 style="flex: 1; font-weight: 500;">Quản lý Templates</h3>
        </header>

        <!-- Content Area -->
        <div class="content-area">
            <div class="list-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Danh sách Mẫu Dự án (Templates)</h2>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="searchTemplateInput" placeholder="🔍 Tìm kiếm template..." class="grid-input" style="width: 250px; padding: 8px 12px; border-radius: 20px;">
                        <button id="btnAddNewTemplate" style="padding: 8px 16px; background: var(--primary-color); color: white; border: none; border-radius: var(--border-radius-sm); cursor: pointer; font-weight: 500;">
                            + Tạo Template Mới
                        </button>
                    </div>
                </div>

                <!-- Templates Grid -->
                <div id="templatesContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;">
                    <!-- Templates will be rendered here as cards -->
                </div>
            </div>
        </div>
    </main>

    <!-- Template Edit Modal -->
    <div id="templateEditModal" class="modal">
        <div class="modal-content" style="max-width: 800px; width: 90%;">
            <div class="modal-header">
                <h2 id="templateModalTitle">Tạo Template Mới</h2>
                <button class="close-modal" id="closeTemplateModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <input type="hidden" id="modalTemplateId">
                    <div class="form-group">
                        <label>Tên Template</label>
                        <input type="text" id="modalTemplateName" placeholder="Ví dụ: Game Casual (2D)" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--surface-color); color: var(--text-primary);">
                    </div>
                    <div class="form-group">
                        <label>Mô tả Template</label>
                        <textarea id="modalTemplateDesc" placeholder="Mô tả về template này..." style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--surface-color); color: var(--text-primary); resize: vertical; min-height: 60px;"></textarea>
                    </div>
                    
                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 10px 0;">
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h3 style="margin: 0; font-size: 1.1em;">Danh sách Tasks (Use Cases) mẫu</h3>
                        <button id="btnAddTaskToTemplate" style="padding: 6px 12px; background: var(--status-success); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em;">+ Thêm Task</button>
                    </div>
                    
                    <div id="templateTasksContainer" style="display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px;">
                        <!-- Task rows injected here -->
                    </div>
                    
                    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                        <button type="button" id="btnCancelTemplate" style="padding: 10px 16px; background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 4px; cursor: pointer;">Hủy</button>
                        <button type="button" id="btnSaveTemplate" style="padding: 10px 16px; background: var(--primary-color); color: white; border: none; border-radius: 4px; cursor: pointer;">Lưu Template</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/templates.js"></script>
</body>
</html>
